<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>求职手账 v9.2</title>
<style>
:root{--bg:#fffaf3;--card:#fff;--ink:#2a2118;--muted:#75695c;--line:#eadfce;--orange:#f59e0b;--orange2:#ea580c;--soft:#fff1d6;--green:#15803d;--red:#b91c1c;--blue:#2563eb;--shadow:0 8px 28px rgba(82,56,28,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow)}h1{font-size:22px;margin:0}.sub,.muted{color:var(--muted);font-size:13px}.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}.tab{border:0;background:transparent;padding:9px 14px;border-radius:10px;color:var(--muted)}.tab.active{background:var(--soft);color:#9a4b00;font-weight:700}.hidden{display:none!important}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.dashboard{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{padding:15px 16px}.metric .num{font-size:25px;font-weight:900;margin-top:3px}.metric .label{color:var(--muted);font-size:12px}.metric.clickable{cursor:pointer}.metric.clickable:hover,.metric.active{border-color:#f59e0b;background:#fff9ed}.filter-card{padding:13px;margin-bottom:12px}.filters{display:grid;grid-template-columns:minmax(230px,1.8fr) repeat(4,minmax(130px,1fr)) auto;gap:9px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(245,158,11,.12)}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}.action-group{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}.btn.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff}.btn.soft{background:var(--soft);color:#9a4b00}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fee2e2;color:#991b1b}.btn.tiny{padding:6px 9px;border-radius:9px;font-size:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1250px}.table th,.table td{padding:11px 12px;text-align:left;border-bottom:1px solid #f0e8dc;font-size:13px;vertical-align:middle}.table th{position:sticky;top:0;background:#fffaf7;color:#6f6255;font-size:12px;z-index:1}.table tr:hover td{background:#fffdf9}.company{font-weight:800}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#f6f2ed}.pill.orange{background:#fff0cf;color:#9a4b00}.pill.green{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#991b1b}.pill.blue{background:#dbeafe;color:#1d4ed8}.empty{padding:50px;text-align:center;color:var(--muted)}.prio{font-weight:900}.prio.S,.prio.A{color:#c2410c}.prio.B{color:#b45309}.due{font-weight:800;color:#b91c1c}.ok{color:#15803d}.modal{position:fixed;inset:0;background:rgba(43,34,26,.38);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.open{display:flex}.sheet{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(42,33,24,.24);border:1px solid var(--line)}.sheet.small{width:min(650px,100%)}.sheet-head{position:sticky;top:0;background:#fff;z-index:2;padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sheet-body{padding:20px}.close{border:0;background:#f5efe8;border-radius:10px;width:34px;height:34px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:18px}.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}.schedule-row{display:grid;grid-template-columns:28px 160px 120px 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}.toast{position:fixed;right:20px;bottom:20px;background:#2a2118;color:#fff;padding:11px 14px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}.note{background:#fff7e8;border:1px solid #f5dfb9;border-radius:12px;padding:10px 12px;font-size:13px;color:#8a4a08;margin-bottom:12px}
@media(max-width:1150px){.dashboard{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:repeat(3,1fr)}.filters .search{grid-column:1/-1}.grid2{grid-template-columns:1fr}}
@media(max-width:760px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.tabs{width:100%;overflow:auto}.dashboard{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.schedule-row{grid-template-columns:28px 1fr}.schedule-row>*:nth-child(3),.schedule-row>*:nth-child(4){grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">求</div><div><h1>求职手账</h1><div class="sub">orange-v9.2 · 官网进度 7 天复查</div></div></div>
    <div class="tabs"><button class="tab active" data-view="list">投递</button><button class="tab" data-view="schedule">日程</button><button class="tab" data-view="analytics">数据分析</button></div>
  </div>

  <section id="listView">
    <div class="dashboard">
      <div class="card metric"><div class="label">总投递</div><div class="num" id="sTotal">0</div></div>
      <div class="card metric"><div class="label">推进中</div><div class="num" id="sActive">0</div></div>
      <div class="card metric"><div class="label">进入面试</div><div class="num" id="sInterview">0</div></div>
      <div class="card metric"><div class="label">Offer</div><div class="num" id="sOffer">0</div></div>
      <div class="card metric clickable" id="dueCard"><div class="label">待查官网</div><div class="num" id="sDue">0</div></div>
      <div class="card metric"><div class="label">今日日程</div><div class="num" id="sToday">0</div></div>
      <div class="card metric clickable" id="dupCard"><div class="label">重复岗位组</div><div class="num" id="sDup">0</div></div>
    </div>

    <div class="card filter-card">
      <div class="filters">
        <input id="search" class="input search" placeholder="搜索公司 / 岗位 / 地点 / 渠道" />
        <select id="stageFilter" class="select"><option value="">全部进度</option><option>待投递</option><option>已投递</option><option>笔试</option><option>一面</option><option>二面</option><option>三面</option><option>HR 面</option><option>Offer</option><option>结束</option></select>
        <select id="priorityFilter" class="select"><option value="">全部优先级</option><option>S</option><option>A</option><option>B</option><option>C</option></select>
        <select id="sourceFilter" class="select"><option value="">全部渠道</option></select>
        <select id="sortFilter" class="select"><option value="date_desc">投递日期：最新</option><option value="date_asc">投递日期：最早</option><option value="priority">优先级：S → C</option><option value="next_check">官网查询：最近</option><option value="company">公司：A → Z</option></select>
        <button id="resetBtn" class="btn ghost">重置</button>
      </div>
      <div class="actions"><div class="muted" id="filterSummary"></div><div class="action-group"><button id="duplicateBtn" class="btn ghost">检测重复</button><button id="exportBtn" class="btn soft">导出给 GPT</button><button id="addBtn" class="btn primary">＋ 新增投递</button></div></div>
    </div>

    <div class="card tablewrap"><table class="table"><thead><tr><th>公司</th><th>岗位</th><th>地点</th><th>优先级</th><th>渠道</th><th>投递日期</th><th>进度</th><th>官网复查</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty hidden">没有符合条件的记录</div></div>
  </section>

  <section id="scheduleView" class="hidden">
    <div class="grid2"><div class="card panel"><h3>今日日程</h3><div class="num" id="todayEvents">0</div><div class="sub">未完成事项</div></div><div class="card panel"><h3>全部日程</h3><div class="sub">勾选即可完成 / 恢复</div></div></div>
    <div style="height:14px"></div><div class="card panel" id="scheduleList"></div>
  </section>

  <section id="analyticsView" class="hidden">
    <div class="dashboard" style="grid-template-columns:repeat(5,1fr)"><div class="card metric"><div class="label">总投递</div><div class="num" id="aTotal">0</div></div><div class="card metric"><div class="label">推进中</div><div class="num" id="aActive">0</div></div><div class="card metric"><div class="label">进入面试</div><div class="num" id="aInterview">0</div></div><div class="card metric"><div class="label">面试率</div><div class="num" id="aRate">0%</div></div><div class="card metric"><div class="label">Offer</div><div class="num" id="aOffer">0</div></div></div>
    <div class="grid2"><div class="card panel"><h3>渠道效果（投递量）</h3><div id="channelStats"></div></div><div class="card panel"><h3>失败阶段</h3><div id="failureStats"></div></div></div>
    <div style="height:14px"></div><div class="grid2"><div class="card panel"><h3>简历版本</h3><div id="resumeStats"></div></div><div class="card panel"><h3>完整漏斗</h3><div id="funnelStats"></div></div></div>
  </section>
</div>

<div id="appModal" class="modal"><div class="sheet"><div class="sheet-head"><div><b id="appModalTitle">新增投递</b><div class="sub">官网投递默认开启 7 天复查</div></div><button class="close" data-close="appModal">✕</button></div><div class="sheet-body"><form id="appForm"><input type="hidden" id="appId" /><div class="formgrid">
  <div><label>公司 *</label><input id="company" class="input" required /></div><div><label>岗位 *</label><input id="role" class="input" required /></div>
  <div><label>地点</label><input id="city" class="input" /></div><div><label>优先级</label><select id="priority" class="select"><option>S</option><option>A</option><option selected>B</option><option>C</option></select></div>
  <div><label>渠道</label><select id="source" class="select"><option>官网</option><option>Boss</option><option>智联</option><option>猎聘</option><option>邮箱</option><option>内推</option><option>其他</option></select></div><div><label>投递日期</label><input id="applied" type="date" class="input" /></div>
  <div><label>进度</label><select id="stage" class="select"><option>待投递</option><option selected>已投递</option><option>笔试</option><option>一面</option><option>二面</option><option>三面</option><option>HR 面</option><option>Offer</option><option>结束</option></select></div><div><label>岗位方向</label><select id="jobDirection" class="select"><option value="">未记录</option><option>Java 后端</option><option>Agent-AI</option><option>测开</option><option>全栈</option><option>运维</option><option>其他</option></select></div>
  <div><label>失败阶段</label><select id="failureStage" class="select"><option value="">未失败 / 推进中</option><option>简历筛选挂</option><option>笔试挂</option><option>一面挂</option><option>二面挂</option><option>HR 面挂</option><option>主动放弃</option><option>HC 取消</option></select></div><div><label>官网复查</label><select id="officialEnabled" class="select"><option value="true">开启</option><option value="false">关闭</option></select></div>
  <div class="full"><label>官网查询地址</label><input id="officialURL" class="input" placeholder="候选人中心 / 官网投递记录地址" /></div><div class="full"><label>JD 链接</label><input id="jdURL" class="input" placeholder="https://…" /></div><div class="full"><label>面试题链接</label><input id="interviewURL" class="input" placeholder="Notion / 语雀 / 其它链接" /></div>
</div><div class="form-actions"><button type="button" id="deleteBtn" class="btn danger hidden">删除</button><button type="submit" class="btn primary">保存</button></div></form></div></div></div>

<div id="checkModal" class="modal"><div class="sheet small"><div class="sheet-head"><div><b id="checkTitle">官网进度查询</b><div class="sub" id="checkSub"></div></div><button class="close" data-close="checkModal">✕</button></div><div class="sheet-body"><div id="checkNotice" class="note"></div><div class="formgrid">
  <div><label>最新进度</label><select id="checkStage" class="select"><option>已投递</option><option>笔试</option><option>一面</option><option>二面</option><option>三面</option><option>HR 面</option><option>Offer</option><option>结束</option></select></div><div><label>失败阶段</label><select id="checkFailure" class="select"><option value="">未失败 / 仍推进</option><option>简历筛选挂</option><option>笔试挂</option><option>一面挂</option><option>二面挂</option><option>HR 面挂</option><option>主动放弃</option><option>HC 取消</option></select></div>
  <div class="full"><label>查询地址</label><input id="checkURL" class="input" /></div><div class="full"><label>本次查询备注</label><textarea id="checkNote" class="textarea" rows="4" placeholder="例如：官网仍显示评估中 / 已进入人才池"></textarea></div>
</div><div class="form-actions"><button type="button" id="openOfficialBtn" class="btn ghost">打开官网</button><button type="button" id="saveCheckBtn" class="btn primary">记录本次查询</button></div></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API='';let apps=[],events=[],resumes=[],duplicates=[],dueOnly=false,currentCheckId=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function request(url,opt={}){const r=await fetch(API+url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text()||r.statusText);if(r.status===204)return null;const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text()}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
function stageRank(s){return {'待投递':0,'已投递':1,'笔试':2,'一面':3,'二面':4,'三面':5,'HR 面':6,'Offer':7,'结束':-1}[s]??1}
function fmtDate(v){return v?String(v).slice(0,10):'-'}
function isInterview(a){return Math.max(stageRank(a.current_stage),stageRank(a.highest_stage))>=3}
async function load(){[apps,events,resumes,duplicates]=await Promise.all([request('/api/applications'),request('/api/events'),request('/api/resume-versions'),request('/api/duplicates')]);fillSource();render();renderSchedule();await renderAnalytics()}
function fillSource(){const sel=$('sourceFilter'),value=sel.value,sources=[...new Set(apps.map(a=>a.source).filter(Boolean))].sort();sel.innerHTML='<option value="">全部渠道</option>'+sources.map(s=>`<option>${esc(s)}</option>`).join('');sel.value=value}
function filtered(){let out=[...apps],q=$('search').value.trim().toLowerCase(),stage=$('stageFilter').value,prio=$('priorityFilter').value,source=$('sourceFilter').value;if(q)out=out.filter(a=>[a.company,a.role,a.city,a.source].some(v=>String(v||'').toLowerCase().includes(q)));if(stage)out=out.filter(a=>a.current_stage===stage);if(prio)out=out.filter(a=>a.priority===prio);if(source)out=out.filter(a=>a.source===source);if(dueOnly)out=out.filter(a=>a.official_check_due);const sort=$('sortFilter').value,pm={S:0,A:1,B:2,C:3};out.sort((a,b)=>sort==='date_asc'?String(a.applied).localeCompare(String(b.applied)):sort==='priority'?(pm[a.priority]??9)-(pm[b.priority]??9):sort==='company'?String(a.company).localeCompare(String(b.company),'zh-CN'):sort==='next_check'?String(a.next_official_check_at||'9999').localeCompare(String(b.next_official_check_at||'9999')):String(b.applied).localeCompare(String(a.applied)));return out}
function render(){const list=filtered(),due=apps.filter(a=>a.official_check_due),offers=apps.filter(a=>a.current_stage==='Offer'||String(a.outcome||'').toLowerCase()==='offer'),active=apps.filter(a=>!a.terminal),today=new Date().toISOString().slice(0,10),todayCount=events.filter(e=>!e.completed&&String(e.time||e.event_time||'').slice(0,10)===today).length;$('sTotal').textContent=apps.length;$('sActive').textContent=active.length;$('sInterview').textContent=apps.filter(isInterview).length;$('sOffer').textContent=offers.length;$('sDue').textContent=due.length;$('sToday').textContent=todayCount;$('sDup').textContent=duplicates.length;$('dueCard').classList.toggle('active',dueOnly);$('filterSummary').textContent=`显示 ${list.length} / ${apps.length} 条${dueOnly?' · 仅待查官网':''}`;$('empty').classList.toggle('hidden',list.length>0);$('tbody').innerHTML=list.map(a=>{let check='-';if(a.official_check_enabled){check=a.terminal?'<span class="ok">已结束</span>':a.official_check_due?`<span class="due">到期 · ${fmtDate(a.next_official_check_at)}</span>`:`<span>${fmtDate(a.next_official_check_at)}</span>`}return `<tr><td><div class="company">${esc(a.company)}</div></td><td>${esc(a.role)}</td><td>${esc(a.city||'-')}</td><td><span class="prio ${esc(a.priority||'')}">${esc(a.priority||'-')}</span></td><td>${esc(a.source||'-')}</td><td>${fmtDate(a.applied)}</td><td><span class="pill ${a.current_stage==='Offer'?'green':a.current_stage==='结束'?'red':'orange'}">${esc(a.current_stage||'-')}</span></td><td>${check}${a.official_check_count?`<div class="sub">已查 ${a.official_check_count} 次</div>`:''}</td><td><div class="action-group"><button class="btn tiny ghost" onclick="editApp(${a.id})">编辑</button>${a.official_check_enabled&&!a.terminal?`<button class="btn tiny ${a.official_check_due?'danger':'soft'}" onclick="openCheck(${a.id})">查官网</button>`:''}</div></td></tr>`}).join('')}
function clearForm(){for(const id of ['appId','company','role','city','officialURL','jdURL','interviewURL'])$(id).value='';$('priority').value='B';$('source').value='官网';$('stage').value='已投递';$('jobDirection').value='';$('failureStage').value='';$('officialEnabled').value='true';$('applied').value=new Date().toISOString().slice(0,10);$('deleteBtn').classList.add('hidden')}
function editApp(id){const a=apps.find(x=>x.id===id);if(!a)return;$('appModalTitle').textContent='编辑投递';$('appId').value=id;$('company').value=a.company||'';$('role').value=a.role||'';$('city').value=a.city||'';$('priority').value=a.priority||'B';$('source').value=a.source||'其他';$('applied').value=fmtDate(a.applied)==='-'?'':fmtDate(a.applied);$('stage').value=a.current_stage||'已投递';$('jobDirection').value=a.job_direction||'';$('failureStage').value=a.failure_stage||'';$('officialEnabled').value=a.official_check_enabled?'true':'false';$('officialURL').value=a.official_check_url||'';$('jdURL').value=a.jd_url||'';$('interviewURL').value=a.interview_url||'';$('deleteBtn').classList.remove('hidden');openModal('appModal')}
$('addBtn').onclick=()=>{clearForm();$('appModalTitle').textContent='新增投递';openModal('appModal')};
$('appForm').onsubmit=async e=>{e.preventDefault();const id=$('appId').value,payload={company:$('company').value.trim(),role:$('role').value.trim(),city:$('city').value.trim(),priority:$('priority').value,source:$('source').value,applied:$('applied').value,current_stage:$('stage').value,current_status:$('stage').value,job_direction:$('jobDirection').value,failure_stage:$('failureStage').value,official_check_enabled:$('officialEnabled').value==='true',official_check_url:$('officialURL').value.trim(),jd_url:$('jdURL').value.trim(),interview_url:$('interviewURL').value.trim()};await request(id?`/api/applications/${id}`:'/api/applications',{method:id?'PUT':'POST',body:JSON.stringify(payload)});closeModal('appModal');toast('已保存');await load()};
$('deleteBtn').onclick=async()=>{const id=$('appId').value;if(!id||!confirm('确定删除这条投递吗？'))return;await request(`/api/applications/${id}`,{method:'DELETE'});closeModal('appModal');toast('已删除');await load()};
function openCheck(id){const a=apps.find(x=>x.id===id);if(!a)return;currentCheckId=id;$('checkTitle').textContent=`${a.company} · 官网进度`;$('checkSub').textContent=`上次：${fmtDate(a.last_official_check_at)} · 下次：${fmtDate(a.next_official_check_at)} · 已查 ${a.official_check_count||0} 次`;$('checkStage').value=a.current_stage||'已投递';$('checkFailure').value=a.failure_stage||'';$('checkURL').value=a.official_check_resolved_url||'';$('checkNote').value='';$('checkNotice').textContent=a.official_check_due?'已到复查日期。若本次仍未 Offer / 未淘汰，保存后会自动安排 7 天后再次查询。':'可以提前查询；非终态保存后同样从今天起重新计 7 天。';openModal('checkModal')}
$('openOfficialBtn').onclick=()=>{const u=$('checkURL').value.trim();if(!u)return toast('请先补充官网查询地址');window.open(u,'_blank','noopener')};
$('saveCheckBtn').onclick=async()=>{if(!currentCheckId)return;await request(`/api/applications/${currentCheckId}/official-check`,{method:'POST',body:JSON.stringify({current_stage:$('checkStage').value,current_status:$('checkStage').value,failure_stage:$('checkFailure').value,official_check_url:$('checkURL').value.trim(),note:$('checkNote').value.trim()})});closeModal('checkModal');toast('本次官网查询已记录');await load()};
$('dueCard').onclick=()=>{dueOnly=!dueOnly;render()};$('dupCard').onclick=$('duplicateBtn').onclick=()=>{if(!duplicates.length)return toast('没有发现重复岗位');alert(duplicates.map(g=>`${g.applications[0]?.company||''} / ${g.applications[0]?.role||''}：${g.count} 条`).join('\n'))};
$('exportBtn').onclick=()=>{const ids=filtered().map(a=>a.id).join(',');window.open(`/api/export/gpt?ids=${encodeURIComponent(ids)}`,'_blank')};
['search','stageFilter','priorityFilter','sourceFilter','sortFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('resetBtn').onclick=()=>{$('search').value='';$('stageFilter').value='';$('priorityFilter').value='';$('sourceFilter').value='';$('sortFilter').value='date_desc';dueOnly=false;render()};
function renderSchedule(){const today=new Date().toISOString().slice(0,10),pending=events.filter(e=>!e.completed&&String(e.time||e.event_time||'').slice(0,10)===today);$('todayEvents').textContent=pending.length;$('scheduleList').innerHTML=events.length?events.slice().sort((a,b)=>String(a.time||a.event_time||'').localeCompare(String(b.time||b.event_time||''))).map(e=>`<div class="schedule-row"><input type="checkbox" ${e.completed?'checked':''} onchange="toggleEvent(${e.id})"><b>${esc(String(e.time||e.event_time||'').replace('T',' ').slice(0,16)||'-')}</b><span class="pill">${esc(e.type||e.event_type||'其他')}</span><div>${esc(e.title||e.note||'')}</div></div>`).join(''):'<div class="empty">暂无日程</div>'}
async function toggleEvent(id){await request(`/api/events/${id}/toggle`,{method:'POST',body:'{}'});await load()}
async function renderAnalytics(){const a=await request('/api/analytics/overview');$('aTotal').textContent=a.total||0;$('aActive').textContent=a.active||0;$('aInterview').textContent=a.interviews||0;$('aRate').textContent=(a.interview_rate||0).toFixed(1)+'%';$('aOffer').textContent=a.offers||0;renderKV('channelStats',a.channels);renderKV('failureStats',a.failures);renderKV('resumeStats',a.resumes);renderKV('funnelStats',a.funnel)}
function renderKV(id,obj){const items=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);$(id).innerHTML=items.length?items.map(([k,v])=>`<div class="list-row"><span>${esc(k)}</span><b>${v}</b></div>`).join(''):'<div class="muted">暂无数据</div>'}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['list','schedule','analytics'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==t.dataset.view))});
load().catch(e=>{console.error(e);toast('加载失败：'+e.message)});
</script>
</body>
</html>
